<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
background-size:400% 400%;
animation:bg 10s infinite alternate;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.card{
width:90%;
max-width:450px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.2);
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.profile{
width:120px;
height:120px;
border-radius:50%;
margin:auto;
border:4px solid #fff;
object-fit:cover;
}

h1{
margin-top:20px;
font-size:32px;
}

p{
margin:15px 0 30px;
font-size:16px;
line-height:1.7;
color:#e5e7eb;
}

.telegram-btn{
display:block;
padding:16px;
background:#0088cc;
text-decoration:none;
color:#fff;
font-size:18px;
font-weight:600;
border-radius:50px;
transition:.3s;
box-shadow:0 10px 25px rgba(0,136,204,.4);
}

.telegram-btn:hover{
transform:translateY(-4px);
background:#0077b5;
}

.footer{
margin-top:25px;
font-size:14px;
opacity:.8;
}

</style>

<script>

}
